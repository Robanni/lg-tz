[project]
name = "lg-tz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.3",
    "fastcms",
    "psycopg>=3.2.0",
    "psycopg-binary>=3.2.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tenacity>=9.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0", "ruff>=0.9"]

[tool.ruff]
line-length = 99
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
fastcms = { git = "https://github.com/Robanni/fastcms.git" }
